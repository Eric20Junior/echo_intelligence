# Roadmap Phase 6 packaging build. The Linux job's steps are exactly what was
# run and verified manually during development (see docs/roadmap.md's Phase 6
# section) — `npm test` then `npm run package`, nothing CI-specific. The
# windows-latest/macos-latest jobs run the identical `npm run package` script
# (scripts/package.js already branches on process.platform for the OS-specific
# SEA/codesign steps), but have NOT been executed on those runners yet — this
# workflow itself is the first real attempt, flagged as unverified until it's
# actually been run and its artifacts smoke-tested on those OSes.
#
# Pushing a tag matching v* additionally zips each OS's dist/ folder and
# publishes them to a GitHub Release named after the tag — that's what the
# one-line install.sh/install.ps1 scripts (docs/install.md) download. Windows
# and macOS also publish a native installer (.exe / .dmg) built from the same
# dist/ tree — that's what a download page's button links to, since a zip
# creates no shortcuts and leaves the operator in a file manager.
name: package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Each OS is an independent verification target (that's the whole point of
      # this matrix — Windows/macOS were unverified until this workflow actually
      # ran). Default fail-fast would cancel the other two the moment any one
      # OS fails, hiding whether they'd have passed.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # better-sqlite3@12.11.1 only publishes prebuilt binaries for Node ABI
      # 127 (Node 22+), not ABI 115 (Node 20) — confirmed directly by probing
      # its GitHub release assets. On Node 20, npm has no prebuilt to fetch
      # and falls back to compiling from source via node-gyp, which crashes
      # on windows-latest specifically: node-gyp's Visual Studio detection
      # can't parse the preview VS2026 (v18) install these runners now ship
      # alongside the stable VS2022 one (confirmed live, a still-open
      # upstream bug: nodejs/node-gyp#3282/#3250/#3214, not fixed by
      # forcing msvs_version — that only filters candidates *after* the
      # crashing enumeration step, and installing a newer node-gyp isn't an
      # option either since node-gyp 13.x requires Node >=22). Using Node 22
      # here sidesteps all of it: a real prebuilt exists, so node-gyp is
      # never invoked at all.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Detection pipeline tests are pure regex/logic, no network or native-asset
      # dependency — safe to run on every OS as a smoke check before packaging.
      - run: npm test

      # scripts/package.js deliberately does NOT fetch the local-LLM-fallback
      # model itself (see its header comment) — a CI runner starts with an empty
      # models/ dir every time, so it must be fetched explicitly before packaging.
      - run: node scripts/download-model.mjs

      - run: npm run package

      # The ffmpeg binary is the entire capture path (lib/capture/mic-source.js)
      # and was missing from every release for months: nothing in the build
      # fails without it, and on Linux a system ffmpeg masks the gap entirely,
      # so only a Windows operator ever saw the symptom. Assert it's actually
      # in the artifact rather than trusting the copy step stays in place.
      - name: Verify ffmpeg is bundled
        shell: bash
        run: test -f dist/bin/ffmpeg || test -f dist/bin/ffmpeg.exe

      # ISCC.exe is NOT on the windows-latest image (the runner docs list no Inno
      # Setup at all), so install it before building the installer.
      - name: Install Inno Setup
        if: matrix.name == 'windows'
        run: choco install innosetup --no-progress -y

      # Native installers, one format per OS. Deliberately after the zip payload
      # already exists and is asserted: a failure here costs the installer, never
      # the dist/ artifact that already worked. Linux has none yet (.AppImage is
      # still future work) so it just skips.
      - name: Build installer
        if: matrix.name != 'linux'
        run: npm run installer:${{ matrix.name }}

      # Same reasoning as the ffmpeg assertion above — an installer that silently
      # didn't get produced must not pass as a green build.
      - name: Verify installer exists
        if: matrix.name != 'linux'
        shell: bash
        run: ls -lh installer-out/ && test -n "$(ls -A installer-out/)"

      - uses: actions/upload-artifact@v4
        with:
          name: echo-intelligence-${{ matrix.name }}
          path: backend/dist/

      - uses: actions/upload-artifact@v4
        if: matrix.name != 'linux'
        with:
          name: echo-intelligence-installer-${{ matrix.name }}
          path: backend/installer-out/

      - name: Zip release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.name }}" = "windows" ]; then
            powershell -Command "Compress-Archive -Path * -DestinationPath ../../echo-intelligence-${{ matrix.name }}.zip"
          else
            zip -r ../../echo-intelligence-${{ matrix.name }}.zip .
          fi

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # The zip is what install.sh/install.ps1 download; the installer is what
          # the download page's button points at. Both ship on every tag. The
          # installer glob matches nothing on Linux, which action-gh-release only
          # warns about (fail_on_unmatched_files defaults to false).
          files: |
            echo-intelligence-${{ matrix.name }}.zip
            backend/installer-out/*
          draft: false
          prerelease: false
